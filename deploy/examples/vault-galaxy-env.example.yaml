# Objeto ESPECÍFICO DO CLUSTER: o nome do vault é dado pessoal e este repo é
# público, então ele não é versionado aqui. Crie uma vez e o Deployment passa a
# usá-lo por referência (a base só aponta para o nome `vault-galaxy-env`).
#
#   kubectl -n vault-galaxy create configmap vault-galaxy-env \
#     --from-literal=VAULT_NAME=MEU_VAULT
#
# Sem esse ConfigMap o container `sync` não sobe (configMapKeyRef obrigatório).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-galaxy-env
  namespace: vault-galaxy
data:
  VAULT_NAME: "MEU_VAULT"
