server {
    listen 80;
    server_name _;
    root /data/www;
    index index.html;

    # As notas viram trechos dentro do graph.json: nada de cache intermediario.
    location = /data/graph.json {
        add_header Cache-Control "no-store" always;
    }

    # Preferencias da interface (compartilhadas entre dispositivos): o container
    # `prefs` escuta so em localhost do pod; aqui e a unica porta de entrada.
    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
