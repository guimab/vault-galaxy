server {
    listen 80;
    server_name _;
    root /data/www;
    index index.html;

    # As notas viram trechos dentro do graph.json: nada de cache intermediario.
    location = /data/graph.json {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
